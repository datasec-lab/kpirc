[package]
name = "tkpir"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8.5"
bincode = "1.3"
serde = "1.0.216"
rayon = "1.10.0"
num-traits = "0.2.19"
num_cpus = "1.16.0"
common_tool = { path = "common_tool" }
bytebuffer = "2.3.0"
blake2 = "0.10.6"
rand_core = "0.6.4"
hex-literal = "0.4.1"
criterion = "0.5.1"

[target.'cfg(target_arch = "x86_64")'.dependencies]
tfhe = { version = "0.10.0", features = [ "boolean", "shortint", "integer", "x86_64-unix" ] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
tfhe = { version = "0.10.0", features = [ "boolean", "shortint", "integer", "aarch64-unix" ] }

[[bench]]
name = "benches"
harness = false
path = "benches/bench.rs"

[[bin]]
name = "bench_kpir_c_multi"
path = "src/bin/bench_kpir_c_multi.rs"

